name: lint
on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n install.sh
      - name: Python syntax
        run: |
          python -m compileall -q scripts
      - name: JSON syntax
        run: |
          python -m json.tool workflows/z-image-turbo.api.json >/dev/null
